<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNE Mosine — Fase 1 (Hardcore)</title>
<style>
:root{
  --bg:#0a0e14; --panel:#10161f; --border:#7a1f2a; --border2:#2a3542;
  --text:#d7e2ea; --dim:#6b7f8f; --accent:#ff5f5f; --danger:#ff2d3d; --warn:#f5c542;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100%; background:radial-gradient(circle at 50% 0%,#1c0f10,var(--bg) 60%);
  color:var(--text); font-family:'Courier New',monospace; display:flex; justify-content:center; padding:16px;
}
.wrap{width:100%; max-width:640px;}
.hud{background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:10px 14px; margin-bottom:14px; font-size:12px; line-height:1.6;}
.hud .row1{color:var(--accent); font-weight:bold; letter-spacing:1px; margin-bottom:4px;}
.hud .stats{display:flex; flex-wrap:wrap; gap:10px; color:var(--dim);}
.hud .stats b{color:var(--text);}
.timer{color:var(--warn);}
.timer.low{color:var(--danger); animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.4;}}
.inv{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
.slot{border:1px solid var(--border2); border-radius:4px; padding:3px 8px; font-size:11px; color:var(--dim); background:#0d1219;}
.slot.filled{color:var(--accent); border-color:var(--accent);}
.story{background:var(--panel); border:1px solid var(--border2); border-radius:8px; padding:18px; font-size:15px; line-height:1.65; white-space:pre-wrap; margin-bottom:16px;}
.story.gameover{border-color:var(--danger); color:#ffb3ba;}
.story.win{border-color:var(--warn);}
.choices{display:flex; flex-direction:column; gap:10px;}
button.choice{background:#0d1219; border:1px solid var(--border2); color:var(--text); padding:12px 14px; border-radius:6px; font-family:inherit; font-size:14px; text-align:left; cursor:pointer; transition:.15s;}
button.choice:hover{border-color:var(--accent); color:var(--accent);}
button.choice:disabled{opacity:.35; cursor:not-allowed; color:var(--dim);}
button.choice .lock{font-size:11px; display:block; margin-top:3px; color:var(--danger);}
.buy{display:block; margin-top:14px; background:var(--warn); color:#1a1200; text-align:center; padding:14px; border-radius:6px; font-weight:bold; text-decoration:none; letter-spacing:.5px;}
.restart{display:block; width:100%; margin-top:6px; background:transparent; border:1px solid var(--border2); color:var(--dim); padding:10px; border-radius:6px; font-family:inherit; cursor:pointer;}
h1{font-size:12px; letter-spacing:1.5px; color:var(--dim); text-align:center; margin:0 0 4px;}
h2{font-size:11px; letter-spacing:1px; color:var(--accent); text-align:center; margin:0 0 14px; font-weight:normal;}
</style>
</head>
<body>
<div class="wrap">
<h1>🎮 PROJETO MNE MOSINE — FASE 1</h1>
<h2>⚠ MODO HARDCORE TÁTICO ⚠</h2>
<div class="hud" id="hud"></div>
<div id="storyBox" class="story"></div>
<div class="choices" id="choices"></div>
</div>

"01.1.1":{text:`O choque de reinicialização atravessa sua espinha como uma agulha de gelo. A dor queima na base do crânio enquanto o som de estática reverbera dentro do capacete tático. Você abre os olhos devagar: a abóbada acima não tem sol, apenas uma malha trêmula de pixels cinzentos em baixa resolução.

O bracelete indica: [SINCRONIA NEURAL: 60 TURNOS | INTEGRIDADE: 100%]. À frente, o concreto desmorona numa ravina labiríntica e enevoada de 40 metros. O vapor de óleo queimado dificulta a visão.

Como você decide abordar a navegação da ravina?`,

"01.1.2":{text:`Cravando a Faca Prateada nas frestas, você desce com extrema precisão. Na metade do trajeto, encontra o chassi retorcido de um drone de reconhecimento. Destrava o compartimento e encontra uma Bateria Auxiliar (+25%) e um Medkit Tático.

Abaixo, a encosta se divide em três plataformas no escuro, sem visibilidade total.

integrityDelta:-25, choices:[

"01.1.4":{text:`Você explora o posto destruído e encontra o cadáver de um operador MNE. Recupera um Transmissor Cripto (chave digital militar). O gasto de exploração consumiu 10 turnos vitais.

let state = {};
function resetState(){ state = {node:START, integrity:100, turns:60, inventory:[], timeLeft:300, timerId:null, over:false}; }
resetState();

function itemLabel(k){return ITEM_NAMES[k]||k;}

function renderHUD(){
  const mm = String(Math.floor(state.timeLeft/60)).padStart(2,"0");
  const ss = String(state.timeLeft%60).padStart(2,"0");
  const low = state.timeLeft<=60;
  const slots = [0,1,2,3].map(i=>{
    const it = state.inventory[i];
    return `<span class="slot ${it?"filled":""}">${it?itemLabel(it):"Vazio"}</span>`;
  }).join("");
  document.getElementById("hud").innerHTML = `
    <div class="row1">FASE 1 — O DESPERTAR E A REDE CORROMPIDA</div>
    <div class="stats">
      <span>Nó: <b>${state.node}</b></span>
      <span>Turnos: <b>${state.turns}/60</b></span>
      <span>Integridade: <b>${state.integrity}%</b></span>
      <span class="timer ${low?"low":""}">⏱ ${mm}:${ss}</span>
    </div>
    <div class="inv">${slots}</div>`;
}

function startTimer(){
  clearInterval(state.timerId);
  state.timerId = setInterval(()=>{
    if(state.over) return;
    state.timeLeft -= 5;
    if(state.timeLeft<=0){
      state.timeLeft=0; renderHUD();
      clearInterval(state.timerId);
      showTimeout();
      return;
    }
    renderHUD();
  },5000);
}

function showTimeout(){
  state.over=true;
  const box = document.getElementById("storyBox");
  box.className="story gameover";
  box.textContent = `O tempo se esgota. Luzes de emergência piscam em vermelho intenso e uma voz sintética ecoa: "PROTOCOLO DE CONTENÇÃO ATIVADO — INTRUSO NÃO NEUTRALIZADO." As paredes de metal se fecham ao seu redor, os dutos liberam um gás denso e sua conexão com a Matriz é forçosamente cortada.

SISTEMA CORROMPIDO — FALHA POR TEMPO ESGOTADO.`;
  document.getElementById("choices").innerHTML = `<button class="restart" onclick="restart()">🔄 Reiniciar do Ponto Zero [01.1.1]</button>`;
}

function restart(){ resetState(); render(); startTimer(); }

function pickChoice(c){
  if(c.requireItem && !state.inventory.includes(c.requireItem)) return;
  if(c.requireAny && !c.requireAny.some(it=>state.inventory.includes(it))) return;
  state.node = c.next;
  render();
}

function render(){
  const n = nodes[state.node];
  if(n.integrityDelta) state.integrity = Math.max(0, state.integrity+n.integrityDelta);
  if(n.turnsDelta) state.turns = Math.max(0, state.turns+n.turnsDelta);
  else if(!n.gameOver && !n.endDemo && state.node!==START) state.turns = Math.max(0, state.turns-2);
  if(n.gain) n.gain.forEach(it=>{ if(!state.inventory.includes(it) && state.inventory.length<4) state.inventory.push(it); });
  if(n.lose) n.lose.forEach(it=>{ state.inventory = state.inventory.filter(x=>x!==it); });
  if(n.gameOver){ state.integrity = 0; state.turns=0; }
  if(n.endDemo){ state.turns=Math.max(0,state.turns); }

  renderHUD();
  const box = document.getElementById("storyBox");
  box.className = "story" + (n.gameOver?" gameover":"") + (n.endDemo?" win":"");
  box.textContent = n.text;

  const cDiv = document.getElementById("choices");
  cDiv.innerHTML = "";

  if(n.gameOver){
    clearInterval(state.timerId); state.over=true;
    cDiv.innerHTML = `<button class="restart" onclick="restart()">🔄 Reiniciar do Ponto Zero [01.1.1]</button>`;
    return;
  }
  if(n.endDemo){
    clearInterval(state.timerId); state.over=true;
    cDiv.innerHTML = `
      <div style="text-align:center; color:var(--warn); font-size:13px; margin-bottom:6px;">
        🔒 FIM DA DEMO GRATUITA — ${n.ending}<br>Progresso salvo no nó ${state.node}.
      </div>
      <a class="buy" href="${BUY_LINK}" target="_blank">👉 Liberar Fases 2 e 3 por R$ 8,90</a>
      <button class="restart" onclick="restart()">🔄 Jogar a demo novamente</button>`;
    return;
  }

  n.choices.forEach(c=>{
    let locked = false, lockLabel = "";
    if(c.requireItem && !state.inventory.includes(c.requireItem)){ locked=true; lockLabel=itemLabel(c.requireItem); }
    if(c.requireAny && !c.requireAny.some(it=>state.inventory.includes(it))){ locked=true; lockLabel=c.requireAny.map(itemLabel).join(" ou "); }
    const btn = document.createElement("button");
    btn.className="choice";
    btn.disabled = locked;
    btn.innerHTML = c.label + (locked?`<span class="lock">🔒 Requer: ${lockLabel}</span>`:"");
    btn.onclick = ()=>pickChoice(c);
    cDiv.appendChild(btn);
  });
}

render();
startTimer();
</script>
</body>
</html>
